[project]
name = "segformer"
version = "0.0.1"
description = "Door/railing semantic segmentation (SegFormer/MLX) consumer for the xtion RGB-D capture pipeline."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pyzmq>=25",
    "msgpack>=1.0",
    "lz4>=4.0",        # optional-on-the-wire, but cheap and 'replay --compress' wants it
]

[project.optional-dependencies]
# Primary backend: SegFormer on MLX (Apple GPU). Pillow matches HF's resize.
# No huggingface_hub / safetensors: mx.load reads safetensors; the registry
# downloads pinned weights with a plain HTTPS GET + sha256 check.
mlx = ["mlx>=0.32", "pillow>=10"]
# Alternate backend: SegFormer via HF transformers on Apple MPS or CPU.
# For a machine without MLX. Also covers tools/compare_hf.py.
torch = ["torch>=2.6", "torchvision>=0.19", "transformers>=4.49", "pillow>=10"]
reference = ["segformer[torch]"]
viewer = ["opencv-python>=4.8"]
# `--spatial` audio: one tone for both door types, one for railing/bannister,
# one (pulsed) for stairs. Needs PortAudio; without it `run --spatial` still
# shows the radar window, just silent.
audio = ["sounddevice>=0.4"]
dev = ["pytest>=7", "opencv-python>=4.8", "sounddevice>=0.4"]

[project.scripts]
segformer = "segformer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["segformer", "stream", "consumer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
