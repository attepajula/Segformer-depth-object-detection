[project]
name = "segformer"
version = "0.0.1"
description = "Door/railing semantic segmentation (SegFormer/MLX) consumer for the xtion RGB-D capture pipeline."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "pyzmq>=25",
    "msgpack>=1.0",
]

[project.optional-dependencies]
# Primary backend: SegFormer on MLX (Apple GPU). Pillow matches HF's resize.
mlx = ["mlx>=0.32", "safetensors>=0.4", "huggingface-hub>=0.24", "pillow>=10"]
# Secondary backend, not implemented.
torch = ["torch>=2.4", "torchvision>=0.19"]
# HF transformers reference for tools/compare_hf.py (CPU).
reference = ["torch>=2.4", "torchvision>=0.19", "transformers>=4.40", "pillow>=10"]
viewer = ["opencv-python>=4.8"]
dev = ["pytest>=7", "opencv-python>=4.8"]

[project.scripts]
segformer = "segformer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["segformer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
