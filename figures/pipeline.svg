<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="580" viewBox="0 0 1600 580" xmlns="http://www.w3.org/2000/svg"
     font-family="Monospace">
  <rect width="1600" height="580" fill="#ffffff"/>

  <!-- row 1: CAM, NET, UP, THRESH, GATE (left to right) -->
  <rect x="40"   y="60" width="280" height="160" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <rect x="350"  y="60" width="280" height="160" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <rect x="660"  y="60" width="280" height="160" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <rect x="970"  y="60" width="280" height="160" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <rect x="1280" y="60" width="280" height="160" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>

  <!-- row 2: TRACK, LOC, SOUND (left to right, left-aligned to row 1) -->
  <rect x="40"   y="360" width="280" height="160" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <rect x="350"  y="360" width="280" height="160" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <rect x="660"  y="360" width="280" height="160" rx="8" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333333"/>
    </marker>
  </defs>

  <!-- main chain, row 1 -->
  <path d="M 320 140 L 350 140"   stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 630 140 L 660 140"   stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 940 140 L 970 140"   stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 1250 140 L 1280 140" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1265" y="48" font-size="12" fill="#1a1a1a" text-anchor="middle">door, screen-door</text>

  <!-- main chain, row 2 -->
  <path d="M 320 440 L 350 440" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 630 440 L 660 440" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- branch: THRESH -> GATE (door, screen-door) stays in row 1, already covered above -->
  <!-- branch: THRESH -> TRACK (other 4 classes), routed around the gap -->
  <path d="M 1110 220 L 1110 310 L 220 310 L 220 360" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="570" y="300" width="260" height="20" fill="#ffffff"/>
  <text x="700" y="315" font-size="13" fill="#1a1a1a" text-anchor="middle">other 4 classes, no depth check</text>

  <!-- GATE -> TRACK, routed around the gap -->
  <path d="M 1420 220 L 1420 250 L 180 250 L 180 360" fill="none" stroke="#333333" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- depth, bypasses the network: CAM -> GATE, arched over row 1 -->
  <path d="M 180 60 L 180 20 L 1420 20 L 1420 60" fill="none" stroke="#5577aa" stroke-width="2"
        stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="800" y="14" font-size="13" fill="#5577aa" text-anchor="middle">depth, bypasses the network</text>

  <!-- depth: CAM -> LOC, routed through the left margin and the gap -->
  <path d="M 100 220 L 100 335 L 490 335 L 490 360" fill="none" stroke="#5577aa" stroke-width="2"
        stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <rect x="110" y="325" width="60" height="20" fill="#ffffff"/>
  <text x="140" y="340" font-size="13" fill="#5577aa" text-anchor="middle">depth</text>

  <!-- box text -->
  <g font-size="14" fill="#1a1a1a" text-anchor="middle">
    <text x="180" y="88" font-weight="bold">Depth camera</text>
    <text x="180" y="112">640×480 colour</text>
    <text x="180" y="132">640×480 depth, mm</text>
    <text x="180" y="152">+ lens parameters</text>

    <text x="490" y="88" font-weight="bold">Neural network</text>
    <text x="490" y="108">(SegFormer)</text>
    <text x="490" y="132">512×512×3 input →</text>
    <text x="490" y="152">150-class probability map,</text>
    <text x="490" y="172">128×128 output grid</text>

    <text x="800" y="88" font-weight="bold">Upsample</text>
    <text x="800" y="120">128×128 → 640×480,</text>
    <text x="800" y="140">one map per class kept</text>
    <text x="800" y="160">(6 of 150)</text>

    <text x="1110" y="88" font-weight="bold">Per-class threshold</text>
    <text x="1110" y="116">0.85 — door, screen-door</text>
    <text x="1110" y="136">0.45 — railing, bannister,</text>
    <text x="1110" y="156">stairs, stairway</text>

    <text x="1420" y="88" font-weight="bold">Depth check</text>
    <text x="1420" y="116">door / screen-door only</text>
    <text x="1420" y="136">~0.4–1.9 m wide, flat,</text>
    <text x="1420" y="156">upright — else rejected</text>

    <text x="180" y="408" font-weight="bold">Confirm + hold</text>
    <text x="180" y="436">3-frame confirm,</text>
    <text x="180" y="456">6-frame hold</text>
    <text x="180" y="476">(all 6 classes)</text>

    <text x="490" y="408" font-weight="bold">Direction + distance</text>
    <text x="490" y="432">bearing from pixel column,</text>
    <text x="490" y="452">distance = depth under mask,</text>
    <text x="490" y="472">smoothed per detection</text>

    <text x="800" y="408" font-weight="bold">3 tones</text>
    <text x="800" y="436">220 / 440 / 660 Hz,</text>
    <text x="800" y="456">panned left/right</text>
    <text x="800" y="476">by direction</text>
  </g>
</svg>
